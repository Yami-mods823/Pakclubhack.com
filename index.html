<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wingo Trend Predictor</title>

<style>
/* ===== SAME ORIGINAL STYLE (shortened but important parts kept) ===== */

body {
  background: #1a0f0a;
  color: #fff;
  font-family: Arial;
  padding: 16px;
}

.container {
  max-width: 540px;
  margin: auto;
}

.card {
  background: #2d1810;
  padding: 16px;
  border-radius: 12px;
  margin-bottom: 12px;
}

/* ✅ FIXED GRID */
.number-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(60px, 1fr));
  gap: 10px;
}

/* Button */
.btn-number {
  height: 60px;
  border-radius: 10px;
  border: none;
  background: #3a2518;
  color: white;
  font-size: 18px;
}

.btn-number.selected {
  background: orange;
}

/* Predict button */
.btn-predict {
  width: 100%;
  padding: 14px;
  background: orange;
  border: none;
  border-radius: 10px;
  color: white;
  font-size: 16px;
}

/* Mobile extra */
@media (max-width: 360px) {
  .number-grid {
    grid-template-columns: repeat(4, 1fr);
  }
}
</style>

</head>

<body>

<div class="container">

  <div class="card">
    <h3>Select Last Number (0-9)</h3>
    <div id="numberGrid" class="number-grid"></div>
  </div>

<button class="btn-predict" id="predictBtn" disabled>ANALYZE & PREDICT</button>

  <div class="card">
    <h3>Next Prediction</h3>
    <div id="resultText">Select a number</div>
  </div>

</div>

<script>
let selectedNumber = null;

/* ✅ SAFE GRID INIT (IMPORTANT FIX) */
function initializeNumberGrid() {
  const grid = document.getElementById('numberGrid');

  if (!grid) {
    console.error("Grid not found");
    return;
  }

  grid.innerHTML = "";

  for (let i = 0; i < 10; i++) {
    const btn = document.createElement('button');
    btn.className = 'btn-number';
    btn.textContent = i;

    btn.onclick = () => {
      document.querySelectorAll('.btn-number').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      selectedNumber = i;
      document.getElementById('predictBtn').disabled = false;
    };

    grid.appendChild(btn);
  }
}

/* Prediction */
function runPrediction() {
  if (selectedNumber === null) return;

  const result = Math.random() > 0.5 ? "BIG" : "SMALL";
  document.getElementById('resultText').textContent = result;
}

document.getElementById('predictBtn').onclick = runPrediction;

/* ✅ FINAL FIX (MOST IMPORTANT) */
document.addEventListener('DOMContentLoaded', () => {
  initializeNumberGrid();
});
</script>

</body>
</html>
